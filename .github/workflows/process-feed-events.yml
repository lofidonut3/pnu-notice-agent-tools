name: Process PNU notice events

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      include_baseline:
        description: "Process the current event window on first initialization"
        required: false
        type: boolean
        default: false
      no_send:
        description: "Process and queue notices without sending email"
        type: boolean
        default: false
      process_limit:
        description: "Maximum candidates to process in this run"
        type: choice
        options: ["1", "5", "20"]
        default: "20"
      send_limit:
        description: "Maximum existing notifications to send in this run"
        type: choice
        options: ["1", "5", "20"]
        default: "20"

permissions:
  contents: read

jobs:
  process:
    concurrency:
      group: pnu-notice-polling-worker
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PNU_DATABASE_URL: ${{ secrets.PNU_DATABASE_URL }}
      PNU_AI_PROVIDER: ${{ vars.PNU_AI_PROVIDER || 'gemini' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      GEMINI_CHAT_MODEL: ${{ vars.GEMINI_CHAT_MODEL }}
      NVIDIA_CHAT_MODEL: ${{ vars.NVIDIA_CHAT_MODEL }}
      PNU_EMAIL_TO: ${{ secrets.PNU_EMAIL_TO }}
      PNU_SMTP_HOST: ${{ secrets.PNU_SMTP_HOST }}
      PNU_SMTP_PORT: ${{ vars.PNU_SMTP_PORT || '587' }}
      PNU_SMTP_FROM: ${{ secrets.PNU_SMTP_FROM }}
      PNU_SMTP_USERNAME: ${{ secrets.PNU_SMTP_USERNAME }}
      PNU_SMTP_PASSWORD: ${{ secrets.PNU_SMTP_PASSWORD }}
      PNU_SMTP_STARTTLS: ${{ vars.PNU_SMTP_STARTTLS || 'true' }}
      EVENTS_URL: https://lofidonut3.github.io/pnu-public-notice-feed/events.json
      PROCESS_LIMIT: ${{ inputs.process_limit || '20' }}
      SEND_LIMIT: ${{ inputs.send_limit || '20' }}
      NO_SEND: ${{ inputs.no_send && '1' || '0' }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Validate runtime configuration
        id: runtime
        shell: bash
        run: |
          if [[ -z "$PNU_DATABASE_URL" ]]; then
            echo "::error::PNU_DATABASE_URL is not configured."
            exit 1
          elif [[ "$PNU_AI_PROVIDER" == "gemini" && -z "$GEMINI_API_KEY" ]]; then
            echo "::error::GEMINI_API_KEY is not configured."
            exit 1
          elif [[ "$PNU_AI_PROVIDER" == "nvidia" && -z "$NVIDIA_API_KEY" ]]; then
            echo "::error::NVIDIA_API_KEY is not configured."
            exit 1
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install local OCR
        if: steps.runtime.outputs.configured == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-kor

      - name: Install worker
        if: steps.runtime.outputs.configured == 'true'
        run: python -m pip install -e ".[analysis,worker]"

      - name: Process feed cursor and outbox
        if: steps.runtime.outputs.configured == 'true'
        shell: bash
        run: |
          args=()
          if [[ "${{ inputs.include_baseline || false }}" == "true" ]]; then
            args+=(--include-baseline)
          fi
          if [[ "$NO_SEND" == "1" ]]; then
            args+=(--no-send)
          fi
          python scripts/run_hosted.py run-watch-cycle \
            --db "$PNU_DATABASE_URL" \
            --events-url "$EVENTS_URL" \
            --provider "$PNU_AI_PROVIDER" \
            --process-limit "$PROCESS_LIMIT" \
            --send-limit "$SEND_LIMIT" \
            --max-attempts 5 \
            --summary-only --fail-on-error \
            --pretty \
            "${args[@]}"
