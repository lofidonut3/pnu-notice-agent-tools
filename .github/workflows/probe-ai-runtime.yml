name: Release superseded diagnostic queue
on:
  workflow_dispatch:
    inputs:
      legacy_group:
        description: "Retired group containing only superseded recovery diagnostics"
        type: choice
        options: ["pnu-notice-watch-runtime", "pnu-watch-request-compiler"]
        required: true
permissions:
  contents: read
concurrency:
  group: ${{ inputs.legacy_group }}
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "Released superseded diagnostic queue; no database or email operation is performed."
